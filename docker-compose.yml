services:
  postgres:
    image: postgres:16
    ports:
      - "54329:5432"
    environment:
      POSTGRES_DB: task_calendar_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_calendar_test"]
      interval: 5s
      timeout: 5s
      retries: 10
